name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check.mjs
      - run: ./scripts/pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: markette-extension
          path: dist/*.zip
